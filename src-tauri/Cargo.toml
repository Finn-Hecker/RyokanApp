[package]
name = "ryokan"
version = "0.6.1"
description = "An immersive, local-first AI Roleplay Engine."
authors = ["Finn-Hecker"]
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ryokan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-dialog = "2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
once_cell = "1.19"
eventsource-stream = "0.2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
webp = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2.13.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
